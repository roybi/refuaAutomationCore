[pytest]
# Pytest configuration for refuaAutomationCore

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Pytest markers for test organization
markers =
    smoke: smoke tests - critical path tests
    regression: regression tests - broader test coverage
    mobile: mobile-specific tests
    ios_only: iOS-only tests
    android_only: Android-only tests
    slow: slow running tests
    2fa_required: requires 2FA authentication
    sequential: must run sequentially (cannot parallelize)
    visual_regression: visual regression tests
    env: environment marker (added dynamically)

# Timeout for tests (in seconds)
timeout = 300

# Xfail behavior
xfail_strict = false
