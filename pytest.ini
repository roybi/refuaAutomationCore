[pytest]
# This is a framework package, not a test repo.
# Tests live in refuaAutomationTests which installs this package.
# Setting testpaths to a non-existent path prevents pytest from discovering
# refua_core/conftest.py as a local conftest while it is also loaded via
# the pytest11 entry_point, which would cause a "plugin already registered" error.
testpaths = tests
norecursedirs = refua_core scripts .git __pycache__ *.egg-info
